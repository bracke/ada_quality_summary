name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    name: Linux build, tests, coverage, and release checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out ada_quality_summary
        uses: actions/checkout@v7
        with:
          path: ada_quality_summary
      - name: Check out sibling crates (transitive pin closure)
        # ada_quality and its transitive dependencies are pinned as ../<name> in alire.toml.
        uses: bracke/project_tools/.github/actions/checkout-ada-siblings@main
        with:
          root: ada_quality_summary
      - name: Set up Alire
        uses: alire-project/setup-alire@v6
        with:
          toolchain: gnat_native=15.2.1 gprbuild

      - name: Raise Alire solver timeout so slow runners get a complete solution
        # Default solver.timeout is 5 s (+10 s grace); a large graph on a slow
        # runner can time out and ship an INCOMPLETE solution, silently dropping
        # transitive crates (then gprbuild fails with "<x>.gpr not found").
        shell: bash
        run: alr settings --global --set solver.timeout 600
      - name: Restore GNATdoc
        # Building GNATdoc from source takes about 30 minutes, so the Alire install prefix is cached.
        id: gnatdoc
        uses: actions/cache@v4
        with:
          path: ~/.alire
          key: gnatdoc-25.2.0-${{ runner.os }}-gnat_native-15.2.1
      - name: Install GNATdoc
        # GNATdoc is a regular Alire crate, not a toolchain component; check_all runs it.
        # Pinned to the version the release gate is verified with locally.
        if: steps.gnatdoc.outputs.cache-hit != 'true'
        run: alr --non-interactive install gnatdoc=25.2.0
      - name: Install GNATprove
        # A prebuilt binary archive, so it is installed on every run rather than cached; check_all proves
        # spark_rules.gpr with it.
        run: alr --non-interactive install gnatprove=15.1.0
      - name: Put Alire-installed tools on PATH
        shell: bash
        run: echo "$HOME/.alire/bin" >> "$GITHUB_PATH"

      - name: Build ada_quality_summary
        # Also generates the gitignored config/ada_quality_summary_config.gpr.
        working-directory: ada_quality_summary
        run: alr --non-interactive build
      - name: Build tests and test tools
        working-directory: ada_quality_summary/tests
        run: alr --non-interactive build
      - name: Production line-coverage gate
        # Instrumented build plus the complete AUnit suite with the instrumented executables
        # substituted for spawned processes; fails below 90 percent.
        working-directory: ada_quality_summary/tests
        run: ./bin/aqs_coverage
      - name: Upload coverage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: ada_quality_summary/coverage/gcov-summary.txt
          if-no-files-found: ignore
      - name: Run release checks
        # Required structure and schemas, toolchain, warnings-as-errors validation build,
        # test build, GNATdoc without warnings, the SPARK rules proof, the staged pin-free release, the AUnit suite, and the coverage evidence.
        working-directory: ada_quality_summary
        run: ./tests/bin/check_all
